services:
  - type: web
    name: ds2api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: LOG_LEVEL
        value: INFO
      - key: DS2API_CONFIG_PATH
        value: /app/data/config.json
      - key: DS2API_ADMIN_KEY
        sync: false
      - key: DS2API_CONFIG_JSON
        sync: false
